[project]
name = "archlens-analyzer"
version = "0.0.1"
description = "Static analysis and graph builder for ArchLens"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archlens"]

[project.scripts]
archlens = "archlens.cli:main"
